name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r desktop/requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          cd desktop
          pyinstaller --noconfirm --onefile --windowed `
            --name "OpenCodePet" `
            --icon "pet.ico" `
            --add-data "sprites;sprites" `
            --add-data "main.py;desktop" `
            --add-data "control.html;desktop" `
            --add-data "app.html;desktop" `
            main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodePet-${{ matrix.python-version }}
          path: desktop/dist/OpenCodePet.exe
          retention-days: 90

      - name: Create release package (ZIP)
        run: |
          cd desktop/dist
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item OpenCodePet.exe release-package/
          Copy-Item ${{ github.workspace }}/README.md release-package/README.txt
          Copy-Item ${{ github.workspace }}/RELEASES.md release-package/RELEASES.txt 2>$null
          Copy-Item ${{ github.workspace }}/LICENSE release-package/LICENSE.txt 2>$null
          if (-not (Test-Path release-package/LICENSE.txt)) {
            Set-Content release-package/LICENSE.txt "OpenCode Pet`nCopyright (c) 2024 iAMv1`n`nLicensed under MIT License.`nSee https://github.com/iAMv1/opencode-pet/blob/main/LICENSE for details."
          }
          Compress-Archive -Path release-package/* -DestinationPath OpenCodePet-v${{ github.ref_name }}-windows.zip -Force
          Remove-Item release-package -Recurse -Force
        shell: pwsh

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop/dist/OpenCodePet.exe
            desktop/dist/OpenCodePet-v${{ github.ref_name }}-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## OpenCode Pet v${{ github.ref_name }}
            
            ### Desktop Application
            
            **Download `OpenCodePet.exe` below** - no installation required, just run it!
            
            #### Requirements
            - Windows 10/11
            - Python 3.11+ (for development only, not needed for the exe)
            
            #### Installation
            1. Download `OpenCodePet.exe`
            2. Double-click to run
            3. The pet will appear on your desktop
            
            #### Features
            - Pixel-art animated pets (Pikachu, Charmander, Doraemon, Gardevoir, Giratina)
            - Real-time session tracking from OpenCode
            - Focus sessions with XP and leveling
            - Weekly wellbeing insights
            - Transparent always-on-top window
            - Drag to reposition
            
            #### What's Changed
            See the [release notes](https://github.com/iAMv1/opencode-pet/releases/tag/${{ github.ref_name }}) for details.
            
            #### License
            See [LICENSE](https://github.com/iAMv1/opencode-pet/blob/main/LICENSE) for details.
            
            ---
            **Built with**: PyInstaller + Python ${{ matrix.python-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
