<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Pet - architecture</title>
  <desc id="desc">How OpenCode Pet works: activity sources feed a pet engine that drives physics, animation and the GDI transparent window at 30 frames per second.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121116"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b35c"/>
      <stop offset="1" stop-color="#ff7a6a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>

  <g id="head" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="80" y="64" fill="#6e6d7a" font-size="20" font-weight="650" letter-spacing="5">HOW IT WORKS</text>
    <text x="80" y="112" fill="#f2f1ec" font-size="34" font-weight="650">Event-driven, zero polling overhead</text>
  </g>

  <g id="sources" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="80" y="150" width="240" height="86" rx="14" fill="#141319" stroke="#23222b"/>
    <text x="200" y="178" fill="#f2f1ec" font-size="20" text-anchor="middle">OpenCode</text>
    <text x="200" y="206" fill="#aaa8b3" font-size="17" text-anchor="middle">sessions</text>

    <rect x="80" y="272" width="240" height="86" rx="14" fill="#141319" stroke="#23222b"/>
    <text x="200" y="300" fill="#f2f1ec" font-size="20" text-anchor="middle">OS activity</text>
    <text x="200" y="328" fill="#aaa8b3" font-size="17" text-anchor="middle">any app</text>
  </g>

  <g id="mid" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="480" y="190" width="240" height="130" rx="14" fill="#141319" stroke="#23222b"/>
    <circle cx="516" cy="224" r="7" fill="#f6b35c"/>
    <text x="540" y="231" fill="#f2f1ec" font-size="19">Pet engine</text>
    <text x="540" y="260" fill="#aaa8b3" font-size="16">physics + animation</text>
    <rect x="512" y="284" width="176" height="6" rx="3" fill="#1c1b22"/>
    <rect x="512" y="284" width="92" height="6" rx="3" fill="url(#flow)"/>
  </g>

  <g id="flow-lines" stroke="#3a3742" stroke-width="3" fill="none">
    <path d="M 320 193 L 476 193 L 476 230"/>
    <path d="M 320 315 L 476 315 L 476 238"/>
  </g>

  <g id="out" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="880" y="190" width="240" height="130" rx="14" fill="#141319" stroke="#23222b"/>
    <circle cx="916" cy="224" r="7" fill="#ff7a6a"/>
    <text x="938" y="231" fill="#f2f1ec" font-size="19">GDI window</text>
    <text x="938" y="260" fill="#aaa8b3" font-size="16">transparent screen</text>
    <text x="938" y="292" fill="#aaa8b3" font-size="16">30 FPS floating pet</text>
  </g>
  <path d="M 720 255 L 790 255 L 790 220" stroke="#3a3742" stroke-width="3" fill="none"/>
</svg>