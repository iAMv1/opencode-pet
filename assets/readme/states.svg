<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Pet - pet states</title>
  <desc id="desc">Seven pet states driven by activity: idle, running, thinking, success, failed, celebrate and wilt, each with trigger and animation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121116"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b35c"/>
      <stop offset="1" stop-color="#ff7a6a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>

  <g id="head" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="64" fill="#6e6d7a" font-size="20" font-weight="650" letter-spacing="5">PET STATES</text>
    <text x="60" y="112" fill="#f2f1ec" font-size="34" font-weight="650">The pet reacts to your activity</text>
  </g>

  <g id="states" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(60 170)">
      <rect width="520" height="78" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="32" fill="#f2f1ec" font-size="24" font-weight="600">Idle</text>
      <text x="28" y="60" fill="#aaa8b3" font-size="19">No activity - calm breathing</text>
      <circle cx="470" cy="39" r="7" fill="#8b8b98"/>
    </g>
    <g transform="translate(620 170)">
      <rect width="520" height="78" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="32" fill="#f2f1ec" font-size="24" font-weight="600">Running</text>
      <text x="28" y="60" fill="#aaa8b3" font-size="19">Typing / working - run animation</text>
      <circle cx="470" cy="39" r="7" fill="#f6b35c"/>
    </g>
    <g transform="translate(60 266)">
      <rect width="520" height="78" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="32" fill="#f2f1ec" font-size="24" font-weight="600">Thinking</text>
      <text x="28" y="60" fill="#aaa8b3" font-size="19">Processing - review pose</text>
      <circle cx="470" cy="39" r="7" fill="#7fc8e8"/>
    </g>
    <g transform="translate(620 266)">
      <rect width="520" height="78" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="32" fill="#f2f1ec" font-size="24" font-weight="600">Success</text>
      <text x="28" y="60" fill="#aaa8b3" font-size="19">Task complete - jump celebration</text>
      <circle cx="470" cy="39" r="7" fill="#5fdd9d"/>
    </g>
    <g transform="translate(60 362)">
      <rect width="520" height="78" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="32" fill="#f2f1ec" font-size="24" font-weight="600">Failed</text>
      <text x="28" y="60" fill="#aaa8b3" font-size="19">Error occurred - sad pose</text>
      <circle cx="470" cy="39" r="7" fill="#ff7b84"/>
    </g>
    <g transform="translate(620 362)">
      <rect width="520" height="78" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="32" fill="#f2f1ec" font-size="24" font-weight="600">Wilt</text>
      <text x="28" y="60" fill="#aaa8b3" font-size="19">Left during focus - sad droop</text>
      <circle cx="470" cy="39" r="7" fill="#e8b96b"/>
    </g>
  </g>
</svg>