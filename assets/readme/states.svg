<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Pet - how the pet reacts to session state</title>
  <desc id="desc">The pet is wired to the state of your running sessions: busy, thinking, error, success, idle, waiting, stale and retry each drive a different pet behavior.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121116"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b35c"/>
      <stop offset="1" stop-color="#ff7a6a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>

  <g id="head" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="64" fill="#6e6d7a" font-size="20" font-weight="650" letter-spacing="5">PET STATES</text>
    <text x="60" y="112" fill="#f2f1ec" font-size="34" font-weight="650">The pet mirrors your session state</text>
    <text x="60" y="146" fill="#aaa8b3" font-size="19">Wired to what your terminal and tools are doing, not to a script.</text>
  </g>

  <g id="states" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(60 190)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Working</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">busy - runs / thinks / reviews, pet jogs</text>
      <circle cx="482" cy="36" r="7" fill="#f6b35c"/>
    </g>
    <g transform="translate(620 190)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Review</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">thinking - processing, review pose</text>
      <circle cx="482" cy="36" r="7" fill="#7fc8e8"/>
    </g>
    <g transform="translate(60 276)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Error</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">failed state - sad pose + reaction</text>
      <circle cx="482" cy="36" r="7" fill="#ff7b84"/>
    </g>
    <g transform="translate(620 276)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Success</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">task complete - jump celebration + XP</text>
      <circle cx="482" cy="36" r="7" fill="#5fdd9d"/>
    </g>
    <g transform="translate(60 362)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Idle</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">nothing active - calm breathing</text>
      <circle cx="482" cy="36" r="7" fill="#8b8b98"/>
    </g>
    <g transform="translate(620 362)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Waiting</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">session idle or stale - waiting gait</text>
      <circle cx="482" cy="36" r="7" fill="#6e6d7a"/>
    </g>
    <g transform="translate(60 448)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Retry</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">retrying after an error</text>
      <circle cx="482" cy="36" r="7" fill="#7fc8e8"/>
    </g>
    <g transform="translate(620 448)">
      <rect width="520" height="72" rx="14" fill="#141319" stroke="#23222b"/>
      <text x="28" y="31" fill="#f2f1ec" font-size="22" font-weight="600">Celebrating</text>
      <text x="28" y="57" fill="#aaa8b3" font-size="18">focus complete - wave + jump</text>
      <circle cx="482" cy="36" r="7" fill="#ffd27d"/>
    </g>
  </g>
</svg>