<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Pet - a pixel desktop companion that reacts to your coding session</title>
  <desc id="desc">Warm near-black studio hero: OpenCode Pet wordmark on the left, a pixel heart pet resting on an amber glow shelf on the right, with mono metadata for window, focus sessions and events.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121116"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f6b35c" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ff7a6a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b0b0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b35c"/>
      <stop offset="1" stop-color="#ff7a6a"/>
    </linearGradient>
  </defs>

  <rect id="canvas" width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <g id="coarse-grid" stroke="#23222b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="400" x2="1200" y2="400" opacity="0"/>
    <line x1="64" y1="48" x2="64" y2="378"/>
    <line x1="1136" y1="48" x2="1136" y2="378"/>
  </g>

  <g id="brand" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="86" fill="#6e6d7a" font-size="20" font-weight="650" letter-spacing="5">PIXEL DESKTOP COMPANION</text>
    <text x="68" y="168" fill="#f2f1ec" font-size="92" font-weight="700" letter-spacing="-2">OpenCode Pet</text>
  </g>

  <g id="en-rule" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="76" y="196" width="64" height="3" rx="1.5" fill="url(#heart)"/>
  </g>

  <g id="promise" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="252" fill="#c9c6d2" font-size="28" font-weight="500">A pixel-art pet that lives on your desktop</text>
    <text x="72" y="296" fill="#c9c6d2" font-size="28" font-weight="500">and reacts to your work in real time.</text>
  </g>

  <g id="pills" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="72" y="330" width="150" height="40" rx="8" fill="#141319" stroke="#23222b"/>
    <rect x="72" y="342" width="8" height="8" rx="2" fill="#f6b35c"/>
    <text x="94" y="356" fill="#aaa8b3" font-size="17">6 pixel pets</text>

    <rect x="234" y="330" width="172" height="40" rx="8" fill="#141319" stroke="#23222b"/>
    <rect x="234" y="342" width="8" height="8" rx="2" fill="#ff7a6a"/>
    <text x="256" y="356" fill="#aaa8b3" font-size="17">10 states</text>

    <rect x="418" y="330" width="182" height="40" rx="8" fill="#141319" stroke="#23222b"/>
    <rect x="418" y="342" width="8" height="8" rx="2" fill="#f6b35c"/>
    <text x="440" y="356" fill="#aaa8b3" font-size="17">30 FPS transparent</text>

    <rect x="612" y="330" width="172" height="40" rx="8" fill="#141319" stroke="#23222b"/>
    <rect x="612" y="342" width="8" height="8" rx="2" fill="#59dd9d"/>
    <text x="634" y="356" fill="#aaa8b3" font-size="17">Windows 10 / 11</text>
  </g>

  <g id="shelf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <ellipse cx="938" cy="352" rx="212" ry="26" fill="#0b0b0f"/>
    <ellipse cx="938" cy="352" rx="212" ry="26" fill="url(#glow)" opacity="0.5"/>
    <rect x="704" y="350" width="470" height="4" rx="2" fill="#1c1b22"/>
    <text x="938" y="398" fill="#6e6d7a" font-size="16" text-anchor="middle">focused</text>
  </g>

  <g id="pixel-pet">
    <g transform="translate(820 96)">
      <rect x="0"  y="0"  width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="16" y="0"  width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="32" y="0"  width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="0"  y="16" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="16" y="16" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="32" y="16" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="0"  y="32" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="16" y="32" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="32" y="32" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="48" y="32" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="16" y="48" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="32" y="48" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="48" y="48" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="16" y="64" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="32" y="64" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="48" y="64" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="0"  y="32" width="16" height="16" rx="2" fill="url(#heart)" opacity="0.55"/>
      <rect x="64" y="32" width="16" height="16" rx="2" fill="url(#heart)"/>
      <rect x="64" y="48" width="16" height="16" rx="2" fill="url(#heart)"/>
    </g>
  </g>

  <g id="status-chip" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="860" y="252" width="148" height="34" rx="17" fill="#141319" stroke="#23222b"/>
    <text x="875" y="274" fill="#aaa8b3" font-size="16">20-min streak</text>
    <text x="1010" y="274" fill="#f6b35c" font-size="16">+40 XP</text>
  </g>

  <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text x="72" y="392" fill="#6e6d7a" font-size="16">win 10/11</text>
    <text x="210" y="392" fill="#6e6d7a" font-size="16">v0.6.0</text>
    <text x="320" y="392" fill="#6e6d7a" font-size="16">python 3.11</text>
    <text x="480" y="392" fill="#6e6d7a" font-size="16">MIT</text>
  </g>
</svg>